name: Bug report
description: Report a reproducible problem
labels: ['bug']
body:
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Include the relevant screen or teaching step. Do not include private conversations or credentials.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce and expected result
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Browser and project version
