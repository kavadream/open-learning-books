name: Feature proposal
description: Propose a focused user-facing or technical improvement
labels: ['enhancement']
body:
  - type: textarea
    id: need
    attributes:
      label: Who needs this and why?
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Proposed behavior and acceptance criteria
    validations:
      required: true
  - type: textarea
    id: validation
    attributes:
      label: How would we verify usefulness?
